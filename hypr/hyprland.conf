# ═══════════════════════════════════════════════════════════════
#  Hyprland — Surface Laptop 4 AMD / Fedora 45
#  Phong cách Omarchy (Catppuccin Mocha)
#  Tài liệu: https://wiki.hypr.land/
# ═══════════════════════════════════════════════════════════════

# ── MÀN HÌNH ───────────────────────────────────────────────────
# Surface Laptop 4 13.5" = 2256x1504 (3:2, ~201 PPI)
# scale 1.6 -> 1410x940 logic (cả 2 chiều chia hết, Hyprland không cảnh báo)
# Muốn chữ TO hơn: đổi 1.6 thành 1.5 (Hyprland sẽ tự làm tròn nhẹ)
# Muốn chữ NHỎ hơn: đổi thành 1.333333
monitor = eDP-1, 2256x1504@60, 0x0, 1.6
# Màn ngoài cắm vào tự nhận, đặt bên phải
monitor = , preferred, auto, 1

# ── BIẾN MÔI TRƯỜNG ────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# AMD Renoir / Vega — tăng tốc giải mã video
env = LIBVA_DRIVER_NAME,radeonsi

# ── FLATPAK ────────────────────────────────────────────────────
# /etc/profile.d/flatpak.sh set biến này, nhưng GDM khởi động Hyprland
# không chắc source nó -> Brave / VS Code / Obsidian sẽ biến mất khỏi
# launcher. Khai báo tay cho chắc.
env = XDG_DATA_DIRS,/home/thanhoai123/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# ── GÕ TIẾNG VIỆT (ibus-bamboo) ────────────────────────────────
# GNOME tự chạy ibus, Hyprland KHÔNG -> phải khai báo tay
env = GTK_IM_MODULE,ibus
env = QT_IM_MODULE,ibus
env = XMODIFIERS,@im=ibus

# ── KHỞI ĐỘNG CÙNG PHIÊN ───────────────────────────────────────
exec-once = ibus-daemon -drxR                 # bộ gõ tiếng Việt
exec-once = systemctl --user start hyprpolkitagent  # hộp thoại xin mật khẩu
exec-once = waybar                            # thanh trạng thái
exec-once = mako                              # thông báo
exec-once = hyprpaper                         # ảnh nền
exec-once = hypridle                          # tự khoá / tắt màn
exec-once = nm-applet --indicator             # wifi ở khay
exec-once = blueman-applet                    # bluetooth ở khay
exec-once = /usr/libexec/gsd-xsettings        # đồng bộ theme GTK
exec-once = wl-paste --watch cliphist store   # lịch sử clipboard

# ── NHẬP LIỆU ──────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
        clickfinger_behavior = true   # 2 ngón = chuột phải
        scroll_factor = 0.5           # touchpad Surface nhạy, giảm lại
    }
}

# Cuộn 2 ngón trên touchpad Surface
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# ── GIAO DIỆN ──────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # Catppuccin Mocha: mauve -> blue
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(11111baa)
    }
}

animations {
    enabled = true
    bezier = omarchy, 0.05, 0.9, 0.1, 1.05
    bezier = quick, 0.15, 0, 0.1, 1
    animation = windows,     1, 4, omarchy, slide
    animation = windowsOut,  1, 3, quick,   popin 80%
    animation = border,      1, 6, default
    animation = fade,        1, 4, default
    animation = workspaces,  1, 4, omarchy, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true          # tiết kiệm pin — quan trọng trên laptop
    vrr = 0
}

# ── BIẾN TẮT ───────────────────────────────────────────────────
$mod      = SUPER
$terminal = alacritty
$browser  = flatpak run com.brave.Browser   # Brave bản flatpak
$files    = nautilus
$menu     = wofi --show drun

# ── PHÍM TẮT: ỨNG DỤNG ─────────────────────────────────────────
bind = $mod, Return, exec, $terminal
bind = $mod, B,      exec, $browser
bind = $mod, E,      exec, $files
bind = $mod, SPACE,  exec, $menu
bind = $mod, W,      killactive,
bind = $mod, V,      togglefloating,
bind = $mod, F,      fullscreen, 0
bind = $mod, P,      pseudo,
bind = $mod, J,      togglesplit,
bind = $mod, L,      exec, loginctl lock-session
bind = $mod SHIFT, E, exit,
# Lịch sử clipboard
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ── PHÍM TẮT: CHỤP ẢNH ─────────────────────────────────────────
bind =      , Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m output --clipboard-only
bind = $mod , Print, exec, hyprshot -m region -o ~/Pictures
bind = $mod, X, exec, hyprpicker -a      # lấy mã màu

# ── PHÍM TẮT: DI CHUYỂN ────────────────────────────────────────
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# ── PHÍM TẮT: WORKSPACE ────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind  = $mod, S, togglespecialworkspace, magic
bind  = $mod SHIFT, S, movetoworkspace, special:magic
bind  = $mod, mouse_down, workspace, e+1
bind  = $mod, mouse_up,   workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── PHÍM CHỨC NĂNG SURFACE ─────────────────────────────────────
# Surface Laptop 4 cần Fn+F1..F3 cho âm lượng; mã phím chuẩn vẫn nhận
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPrev,  exec, playerctl previous

# ── QUY TẮC CỬA SỔ ─────────────────────────────────────────────
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,,floating:1,xwayland:1,fullscreen:0,pinned:0
windowrule = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = float, class:^(org.gnome.Nautilus)$, title:^(.*Properties)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin,   title:^(Picture-in-Picture)$
# Bảng chọn kiểu gõ của ibus-bamboo không được tô viền
windowrule = noborder, class:^(ibus-.*)$

# ── LƯU Ý QUAN TRỌNG (lỗi gập nắp Surface) ─────────────────────
# Gập nắp được logind xử lý ở /etc/systemd/logind.conf.d/50-surface-lid.conf
#   HandleLidSwitch=lock  -> chỉ KHOÁ, không ngủ (tránh lỗi treo s2idle AMD)
# Vì vậy KHÔNG thêm `suspend` vào hypridle.conf. Xem file đó để biết thêm.
