# ═══════════════════════════════════════════════════════════════
#  hyprlock — màn hình khoá (Catppuccin Mocha)
# ═══════════════════════════════════════════════════════════════
general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot          # chụp desktop rồi làm mờ
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

# Đồng hồ
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 110
    font_family = JetBrains Mono ExtraBold
    position = 0, 110
    halign = center
    valign = center
}

# Ngày tháng
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d/%m/%Y"
    color = rgba(bac2deff)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = center
}

# Ô mật khẩu
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <i>Nhập mật khẩu…</i>
    fail_text = <i>Sai mật khẩu ($ATTEMPTS)</i>
    rounding = 12
    position = 0, -60
    halign = center
    valign = center
}

# Tên người dùng
label {
    monitor =
    text = $USER
    color = rgba(bac2deff)
    font_size = 15
    font_family = JetBrains Mono
    position = 0, -130
    halign = center
    valign = center
}

# Pin
label {
    monitor =
    text = cmd[update:30000] printf " %s%%" "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)"
    color = rgba(a6e3a1ff)
    font_size = 14
    font_family = JetBrains Mono
    position = -30, -30
    halign = right
    valign = top
}
