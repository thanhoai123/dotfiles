# ═══════════════════════════════════════════════════════════════
#  hypridle — tự khoá / tắt màn hình
#  ⚠️  CỐ Ý KHÔNG CÓ `suspend` vì Surface Laptop 4 AMD bị lỗi
#      treo khi s2idle (xem ~/surface-lid-fix.sh)
# ═══════════════════════════════════════════════════════════════
general {
    lock_cmd       = pidof hyprlock || hyprlock   # tránh mở trùng
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 2.5 phút: giảm độ sáng để báo sắp khoá
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 5 phút: khoá màn hình
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 phút: tắt màn hình (tiết kiệm pin, KHÔNG ngủ)
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
